kind = "web"
previewPath = "/"
title = "Générateur de Factures"
version = "1.0.0"
id = "artifacts/facture-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19268

[services.development]
run = "pnpm --filter @workspace/facture-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/facture-app", "run", "build" ]
publicDir = "artifacts/facture-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19268"
BASE_PATH = "/"
